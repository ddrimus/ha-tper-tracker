[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "ASYNC", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
