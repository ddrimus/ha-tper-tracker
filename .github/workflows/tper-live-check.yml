name: "TPER: Live Check"
# Weekly check that the real TPER services still answer as the integration expects, plus manual dispatch
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# No default permissions, each job sets its own
permissions: {}

# Cancel a running check when a newer one starts
concurrency:
  group: tper-live-check
  cancel-in-progress: true

jobs:
  check:
    name: Check Hello Bus & Open Data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Shallow, credential-less checkout; nothing here needs git history or push access
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Same Python version as the test suite
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # The integration code imports Home Assistant
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      # Downloads the stop list and asks Hello Bus about a central stop
      - name: Check TPER services
        run: |
          set -euo pipefail
          python scripts/check_tper.py
