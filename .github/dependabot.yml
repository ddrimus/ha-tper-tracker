# Weekly updates, one grouped PR per ecosystem, commits prefixed chore(deps) so release notes file them under Other changes
version: 2
updates:
  # Actions are pinned by SHA, the version comment next to each pin is updated with it
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Test dependencies pinned in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-dependencies:
        patterns:
          - "*"
